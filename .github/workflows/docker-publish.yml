name: Docker Publish

# Build the Docker image for linux/amd64 and linux/arm64, and publish a multi-arch
# manifest to the GitHub Container Registry (GHCR).
#
# Triggers:
#   - Pushes to the default (main) branch  -> tags the image `latest` + `<sha>`
#   - Pushes to a version tag (v*)         -> tags the image `<tag>` + `<sha>`
#   - Manually, via the "Run workflow" button on the Actions tab
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

# The GITHUB_TOKEN only needs to be able to read the repo (checkout) and push packages to GHCR.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # GHCR image names must be lowercase, so normalize the repo name.
  # `github.repository` resolves to "owner/repo" at runtime.
  IMAGE_NAME: mredig/markdowndemo2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # `latest` only on the default branch, so a release never overwrites it.
            type=raw,value=latest,enable={{is_default_branch}}
            # On a tag push (v*), tag the image with the tag name (e.g., v1.2.3).
            type=ref,event=tag
            # Always keep a traceable commit-sha tag.
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Multi-arch: build both and push a single manifest list. A shared
          # buildx builder reuses common base layers across the two arches.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
